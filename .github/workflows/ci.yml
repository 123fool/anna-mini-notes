name: Verify app

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - run: npm run check
      - name: Prepare the pinned Anna dispatcher
        run: uv tool install anna-app-runtime-local==0.2.0a28
      - run: npx playwright install --with-deps chromium
      - run: npm run test:harness
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: test-results/

